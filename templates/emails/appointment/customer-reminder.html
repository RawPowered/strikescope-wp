<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Appointment reminder</title></head>
<body style="margin:0;padding:0;background:%%COLOR_BACKGROUND%%;font-family:Montserrat,Arial,sans-serif;color:#1c1c1c;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:%%COLOR_BACKGROUND%%;"><tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#fff;border-radius:16px;border:1px solid %%COLOR_BORDER%%;">
<tr><td style="padding:32px;">
<h1 style="margin:0 0 12px;font-size:24px;">Reminder: your appointment</h1>
<p style="margin:0 0 16px;font-size:16px;line-height:1.6;">Hi %%FIRST_NAME%%, this is a reminder for your appointment on <strong>%%APPOINTMENT_DATE%%</strong> at <strong>%%APPOINTMENT_TIME%%</strong>.</p>
<p style="margin:0 0 8px;"><strong>Type:</strong> %%APPOINTMENT_TYPE%%</p>
<p style="margin:0 0 8px;"><strong>Location / notes:</strong> %%APPOINTMENT_LOCATION%%</p>
<p style="margin:0;">Specialist: %%SALES_AGENT_NAME%% — %%SALES_AGENT_PHONE%%</p>
</td></tr></table></td></tr></table></body></html>
