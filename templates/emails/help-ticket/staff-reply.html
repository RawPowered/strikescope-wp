<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Ticket update</title></head>
<body style="margin:0;padding:0;background:%%COLOR_BACKGROUND%%;font-family:Montserrat,Arial,sans-serif;color:#1c1c1c;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:%%COLOR_BACKGROUND%%;"><tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#fff;border-radius:16px;border:1px solid %%COLOR_BORDER%%;">
<tr><td style="background:%%COLOR_SECONDARY%%;padding:20px;text-align:center;border-bottom:3px solid %%COLOR_PRIMARY%%;"><img src="%%LOGO_URL%%" alt="%%COMPANY_NAME%%" width="180" style="max-width:180px;height:auto;"></td></tr>
<tr><td style="padding:28px 32px;">
<p style="margin:0 0 8px;font-size:13px;font-weight:700;text-transform:uppercase;color:%%COLOR_PRIMARY%%;">Ticket %%TICKET_NUMBER%%</p>
<h1 style="margin:0 0 12px;font-size:22px;">Reply from %%STAFF_NAME%%</h1>
<div style="font-size:16px;line-height:1.6;color:#1c1c1c;">%%STAFF_MESSAGE%%</div>
<p style="margin:20px 0 0;font-size:14px;color:%%COLOR_MUTED%%;">Reply to this email to continue the conversation about your service at %%SERVICE_ADDRESS%%.</p>
</td></tr>
<tr><td style="background:#fdf7f0;padding:16px 32px;border-top:1px solid %%COLOR_BORDER%%;text-align:center;">
<p style="margin:0;font-size:11px;color:%%COLOR_MUTED%%;">%%LICENSES_FOOTER%%</p>
</td></tr></table></td></tr></table></body></html>
